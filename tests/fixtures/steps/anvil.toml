[project]
name = "steps"
version = "1.2.3"

[target.gen]
kind = "exe"
sources = ["tools/gen.c"]

[target.app]
kind = "exe"

[[target.app.run]]
for-each = "data/*.txt"
output = "{gen}/{stem}.h"
command = ["{target:gen}", "{input}", "{output}", "{stem}"]

[[write]]
path = "src/config.h"
text = "#define APP_VERSION \"{version}\"\n"
